# The layer table of ArchBuilder: the same rules and file format as arc-core's
# xtask/layers.toml (ADR-0001 of arc-core). `cargo xtask layers` checks the workspace against it.
# The layers are this repository's own: the document model, then the commands, then the format
# mappings (archbuilder-io).

# Crates that nothing in the headless layers may reach through normal dependencies.
ui_deny = [
  "winit",
  "wgpu",
  "egui",
  "eframe",
  "egui_dock",
  "accesskit",
  "muda",
  "rfd",
  "raw-window-handle",
]

# The crates of arc-core (one pinned revision, see the workspace manifest) and the third-party
# crates a workspace crate may depend on directly. Third-party versions follow the arc-core lock.
third_party = [
  "arc-app",
  "arc-base",
  "arc-command",
  "arc-doc",
  "arc-draft",
  "arc-geom",
  "arc-gpu",
  "arc-io-common",
  "arc-io-ifc",
  "arc-io-mesh",
  "arc-mesh",
  "arc-solve",
  "arc-ui",
  "arc-view",
  "blake3",
  "fluent-bundle",
  "schemars",
  "serde",
  "serde_json",
  "toml",
  "unic-langid",
]

# Class of every workspace crate: layer(n), ffi(n), app, testkit or tool.
[crates]
archbuilder-model = "layer(0)"
archbuilder-commands = "layer(1)"
archbuilder-io = "layer(2)"
archbuilder = "app"
archbuilder-cli = "app"
xtask = "tool"
