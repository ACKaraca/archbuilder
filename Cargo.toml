[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/ACKaraca/archbuilder"
publish = false

# The foundation is one pinned revision of arc-core (a tagged release once there is one). Every
# crate of it is declared here once; products never use path dependencies in committed files.
# Third-party versions follow the arc-core lock; every crate listed must also appear in
# xtask/layers.toml.
[workspace.dependencies]
arc-base = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-geom = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-mesh = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-doc = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-draft = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-view = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-command = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-app = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-gpu = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-ui = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-io-common = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }
arc-io-ifc = { git = "https://github.com/ACKaraca/arc-core", rev = "44216e7cc050a039385d867a7f136ba36bd6f7b6" }

# Formats the names of the default element types from the message catalogs.
fluent-bundle = { version = "0.16.0", default-features = false }
unic-langid = { version = "0.9.6", default-features = false }
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a number read back from JSON is the number that was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

# The suite lint table (arc-suite docs/engineering/coding-standards.md), as in arc-core. Every
# crate inherits it with `[lints] workspace = true`; `cargo xtask layers` fails a crate that
# does not.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# No-panic policy (tests are exempted in clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Diagnostics output.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Hygiene.
wildcard_imports = "deny"
mem_forget = "deny"
exit = "deny"
# Complexity.
cognitive_complexity = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
# Casting.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
